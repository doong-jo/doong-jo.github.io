<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case 6: 200자 임계값</title>
    <style>
      /* 미사용 @font-face: 동결 조건 유발 */
      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2")
          format("woff2");
      }
      body {
        font: 14px system-ui;
        padding: 16px;
        margin: 0;
      }
      #txt {
        color: #666;
        word-break: break-all;
        font-size: 12px;
      }
      .back-btn {
        display: inline-block;
        margin-top: 16px;
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      .back-btn:hover { background: #555; }
    </style>
  </head>
  <body>
    <script>
      // 파싱 시점에 텍스트를 document.write로 삽입
      const p = new URLSearchParams(location.search);
      const tc = p.has("t") ? parseInt(p.get("t")) : 100;

      const base = "가나다라마바사아자차카타파하";
      if (tc > 0) {
        let t = "";
        while (t.length < tc) t += base;
        document.write('<p id="txt">' + t.slice(0, tc) + '</p>');
      }
    </script>
    <!-- load 지연용 숨겨진 이미지 -->
    <img src="../delay/3000/image" style="display:none" />
    <script>
      // 버튼은 load 후 추가 (초기 텍스트 카운트에서 제외)
      window.addEventListener("load", () => {
        const btn = document.createElement("a");
        btn.href = "../";
        btn.className = "back-btn";
        btn.textContent = "← 목록으로";
        document.body.appendChild(btn);
      });
    </script>
    <script src="../reproduce.js"></script>
  </body>
</html>

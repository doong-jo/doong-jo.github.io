<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case 6: 200자 or 32×32 임계값</title>
    <style>
      body {
        font: 14px system-ui;
        padding: 16px;
        margin: 0;
      }
      #txt {
        color: #666;
        word-break: break-all;
        font-size: 12px;
      }
      #img {
        display: block;
        margin-top: 8px;
        background: #eee;
      }
      .back-btn {
        display: inline-block;
        margin-top: 16px;
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      .back-btn:hover { background: #555; }
    </style>
    <script>
      // 파싱 시점에 텍스트/이미지를 document.write로 삽입
      const p = new URLSearchParams(location.search);
      const tc = p.has("t") ? parseInt(p.get("t")) : 100;
      const ic = p.has("i") ? parseInt(p.get("i")) : 0;

      const base = "가나다라마바사아자차카타파하";
      if (tc > 0) {
        let t = "";
        while (t.length < tc) t += base;
        document.write('<p id="txt" style="color:#666;word-break:break-all;font-size:12px;">' + t.slice(0, tc) + '</p>');
      }
      if (ic > 0) {
        // 외부 placeholder 서비스 사용 (실제 크기 이미지)
        document.write('<img id="img" src="https://placehold.co/' + ic + 'x' + ic + '/ddd/ddd" style="display:block;margin-top:8px;" />');
      }
    </script>
  </head>
  <body>
    <!-- load 지연용 숨겨진 이미지 -->
    <img src="../delay/3000/image" style="display:none" />
    <script>
      // 버튼은 load 후 추가 (초기 텍스트 카운트에서 제외)
      window.addEventListener("load", () => {
        const btn = document.createElement("a");
        btn.href = "../";
        btn.className = "back-btn";
        btn.textContent = "← 목록으로";
        document.body.appendChild(btn);
      });
    </script>
    <script src="../reproduce.js"></script>
  </body>
</html>

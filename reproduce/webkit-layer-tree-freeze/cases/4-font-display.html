<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case 4: font-display</title>
  <style>
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
      font-display: swap;
    }
    body { font: 15px system-ui; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0; color: #666; }
    img { display: block; margin-top: 12px; }
    .back-btn { display: inline-block; margin-top: 16px; padding: 8px 16px; background: #333; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; }
    .back-btn:hover { background: #555; }
  </style>
</head>
<body>
  <h1>Case 4: font-display 속성</h1>
  <p>미사용 + font-display:swap → 동결 예상</p>
  <img src="../delay/2000/image" width="50" height="50">
  <a href="../" class="back-btn">← 목록으로</a>
  <script src="../reproduce.js"></script>
</body>
</html>
